# ─── Server ───────────────────────────────────────────────
server.port=8080

# ─── Database ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ccuser
spring.datasource.password=CampusConnect@2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────
app.jwt.secret=CampusConnect2024SuperSecretKeyForJWTSigningMustBe256BitsLong
app.jwt.expiration-ms=86400000

# ─── CORS ─────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ─── File Upload ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/resumes

# ─── Mail (configure for real email later) ────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:campusconnect@gmail.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Logging ──────────────────────────────────────────────
logging.level.com.campusconnect=DEBUG
logging.level.org.springframework.security=WARN
