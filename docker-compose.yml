version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campusconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campusconnect
      MYSQL_USER: ccuser
      MYSQL_PASSWORD: CampusConnect@2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusconnect-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campusconnect-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusconnect?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=ccuser
      - SPRING_DATASOURCE_PASSWORD=CampusConnect@2024
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=bXlzdXBlcnNlY3JldGtleXRoYXRtdXN0YmVhdGxlYXN0MjU2Yml0c2xvbmc=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: campusconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
